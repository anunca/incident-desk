---
AWSTemplateFormatVersion: "2010-09-09"
Description:
  Incident Desk ECS runtime. Requires existing network, database and TLS
  certificate.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  CertificateArn:
    Type: String
  ImageUri:
    Type: String
    Description: Immutable ECR image URI with @sha256 digest
  DatabaseSecretArn:
    Type: String
    Description: Secrets Manager ARN containing DATABASE_URL as plain secret string
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30
  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS entry
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  TaskSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Only ALB may reach application
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId:
            Ref: AlbSG
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId:
        Ref: TaskSG
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: DatabaseSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  Ref: DatabaseSecretArn
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn:
        Fn::GetAtt:
          - ExecutionRole
          - Arn
      TaskRoleArn:
        Fn::GetAtt:
          - TaskRole
          - Arn
      ContainerDefinitions:
        - Name: api
          Image:
            Ref: ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          PortMappings:
            - ContainerPort: 3000
          Environment:
            - Name: HOST
              Value: 0.0.0.0
            - Name: PORT
              Value: "3000"
            - Name: COOKIE_SECURE
              Value: "true"
          Secrets:
            - Name: DATABASE_URL
              ValueFrom:
                Ref: DatabaseSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: Logs
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: api
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets:
        Ref: PublicSubnets
      SecurityGroups:
        - Ref: AlbSG
  Target:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Ref: VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: "/health/ready"
      Matcher:
        HttpCode: "200"
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: Alb
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn:
            Ref: CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn:
            Ref: Target
  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster:
        Ref: Cluster
      TaskDefinition:
        Ref: Task
      DesiredCount: 2
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            Ref: PrivateSubnets
          SecurityGroups:
            - Ref: TaskSG
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 3000
          TargetGroupArn:
            Ref: Target
Outputs:
  LoadBalancerDns:
    Value:
      Fn::GetAtt:
        - Alb
        - DNSName
