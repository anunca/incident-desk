name: Quality and integration
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: incidents_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incident -d incidents_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://incident:ci-only-password@localhost:5432/incidents_test
      TEST_DATABASE_URL: postgres://incident:ci-only-password@localhost:5432/incidents_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run migrate
      - run: npm run migrate
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t incident-desk:ci .
